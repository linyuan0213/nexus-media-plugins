name: Build Plugin Market Catalog

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate & build catalog
        run: python3 tools/build_catalog.py .

      - name: Commit regenerated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add catalog.json plugins
            git commit -m "chore: 重新构建插件市场目录（catalog.json）"
            git push
            echo "已提交并推送 catalog 变更"
          else
            echo "catalog.json 已是最新，无需提交"
          fi
